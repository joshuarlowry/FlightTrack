name: Flight timeliness page

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    # Only the scheduled (cron) runs are gated by the enable toggle.
    if: |
      github.ref == 'refs/heads/main' && (
        github.event_name != 'schedule' ||
        vars.FLIGHT_UPDATES_ENABLED == 'true'
      )
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Generate site
        env:
          FLIGHT_NUMBER: ${{ secrets.FLIGHT_NUMBER }}
        run: |
          python3 scripts/generate_site.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
